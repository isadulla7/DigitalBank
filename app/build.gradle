plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'kotlin-android-extensions'
    id 'kotlin-kapt'
    id 'com.google.gms.google-services'
    id 'dagger.hilt.android.plugin'
    id 'com.google.firebase.crashlytics'
}

android {
    compileSdkVersion 33
    defaultConfig {
        applicationId "uz.fido.universaldigital"
        minSdkVersion 23
        targetSdkVersion 33
        versionCode 1
        versionName "1.0.0"
        archivesBaseName = "Universal Mobile Digital"

        vectorDrawables.useSupportLibrary = true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildFeatures {
        viewBinding true
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ndk {
                abiFilters "arm64-v8a", "armeabi-v7a"
            }
        }
    }
    dexOptions {
        incremental true
        javaMaxHeapSize "4g"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {

    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'androidx.core:core-ktx:1.9.0'
    implementation 'androidx.appcompat:appcompat:1.5.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.databinding:databinding-runtime:8.0.1'

    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    //material
    implementation 'com.google.android.material:material:1.9.0'

    //biometrics for fingerprint
    implementation 'androidx.biometric:biometric:1.2.0-alpha05'

    //kxt
    implementation 'androidx.work:work-runtime-ktx:2.8.1'

    //maps
    implementation "com.google.android.gms:play-services-vision:20.1.3"
    implementation 'com.google.android.gms:play-services-maps:18.1.0'
    implementation 'com.google.android.gms:play-services-location:21.0.1'
    implementation 'com.google.maps.android:android-maps-utils:2.3.0'

    //barcode model dependencies
    implementation 'com.google.mlkit:barcode-scanning:17.1.0'

    //sms retrieve
    implementation "com.google.android.gms:play-services-auth-api-phone:18.0.1"

    //in-app update
    implementation 'com.google.android.play:core-ktx:1.8.1'

    //paper book
    implementation 'io.paperdb:paperdb:2.7.1'

    //coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.6.4'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.4'

    //lottie animation
    implementation "com.airbnb.android:lottie:5.2.0"

    //liveData
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:2.5.1"
    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'
    compileOnly 'com.google.android.wearable:wearable:2.9.0'
    kapt "androidx.lifecycle:lifecycle-compiler:2.5.1"

    //room
    implementation "androidx.room:room-runtime:2.5.0-rc01"
    implementation "androidx.room:room-ktx:2.5.0-rc01"
    kapt "androidx.room:room-compiler:2.5.0-rc01"

    //navigation jetpack
    implementation "androidx.navigation:navigation-fragment-ktx:2.3.5"
    implementation "androidx.navigation:navigation-ui-ktx:2.3.5"
    implementation "androidx.fragment:fragment-ktx:1.3.6"

    //coil (image loader)
    implementation 'io.coil-kt:coil:2.2.1'
    implementation 'com.squareup.picasso:picasso:2.71828'
    implementation 'com.danikula:videocache:2.7.1'

    //glide
    implementation 'com.github.bumptech.glide:glide:4.14.2'
    kapt 'com.github.bumptech.glide:compiler:4.14.2'

    //hilt
    implementation "com.google.dagger:hilt-android:2.44"
    kapt "com.google.dagger:hilt-android-compiler:2.44"

    //shared preference
    implementation 'androidx.preference:preference-ktx:1.2.0'

    //circle image view
    implementation 'de.hdodenhof:circleimageview:3.1.0'
    implementation 'net.cachapa.expandablelayout:expandablelayout:2.9.2'

    //cameraX dependencies(please don't update)
    implementation "androidx.camera:camera-camera2:1.3.0-alpha02"
    implementation "androidx.camera:camera-lifecycle:1.3.0-alpha02"
    implementation "androidx.camera:camera-view:1.3.0-alpha02"

    //firebase
    implementation platform('com.google.firebase:firebase-bom:26.6.0')
    implementation 'com.google.firebase:firebase-analytics-ktx'
    implementation 'com.google.firebase:firebase-messaging-ktx'
    implementation 'com.google.firebase:firebase-storage:20.1.0'
    implementation 'com.google.firebase:firebase-crashlytics'
    implementation 'com.google.firebase:firebase-dynamic-links-ktx'
    implementation 'com.google.firebase:firebase-firestore-ktx:24.4.4'

    //retrofit
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'

    //okhttp3
    implementation 'com.squareup.okhttp3:okhttp:4.10.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.10.0'

    //gson
    implementation 'com.google.code.gson:gson:2.10'

    //koin
    implementation 'org.koin:koin-androidx-viewmodel:2.0.1'

    //smart refresh layout
    implementation 'com.pnikosis:materialish-progress:1.7'
    implementation 'com.scwang.smartrefresh:SmartRefreshLayout:1.1.2'
    implementation 'com.scwang.smartrefresh:SmartRefreshHeader:1.1.2'

    //shimmer
    implementation 'com.ethanhua:skeleton:1.1.2'
    implementation 'io.supercharge:shimmerlayout:2.1.0'

    //logging
    debugImplementation "com.github.chuckerteam.chucker:library:3.5.2"
    releaseImplementation "com.github.chuckerteam.chucker:library-no-op:3.5.2"

    //ticker
    implementation 'com.robinhood.ticker:ticker:2.0.2'

    //ktor android
    implementation 'io.ktor:ktor-client-android:2.0.1'
    implementation 'io.sentry:sentry-android:5.7.4'

    //kotlin coroutines
    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.4")

    //mlkit
    implementation 'com.google.android.gms:play-services-mlkit-face-detection:17.1.0'
    implementation 'com.google.android.gms:play-services-mlkit-text-recognition:19.0.0'
    implementation 'com.google.android.gms:play-services-mlkit-barcode-scanning:18.2.0'

    //lifecycle (please don't update)
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.5.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.5.1'

    //splash screen android 12
    implementation 'androidx.core:core-splashscreen:1.0.1'

    //staging
    implementation "androidx.security:security-crypto:1.1.0-alpha06"

    implementation 'com.google.android.gms:play-services-vision-common:19.1.3'
    implementation 'com.google.android.gms:play-services-vision:20.1.3'

    //card scanner project
    implementation project(path: ':cardScanner')

    //network module
    implementation project(path: ':network')

    //utils module
    implementation project(path: ':utils')

    //my id(native libs)
    implementation(files("libs/myid-sdk-2.1.2-release.aar"))

    //nfc
    implementation(name: 'd8-hce-sdk-494-cbp-logs-release', ext: 'aar')
    implementation(name: "d8-hce-sec-465-dasho-release", ext: "aar")
    implementation(name: "nfccardreaderlib-release", ext: "aar")

}
