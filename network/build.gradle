plugins {
    id 'com.android.library'
    id 'kotlin-android'
    id 'kotlin-kapt'
    id 'dagger.hilt.android.plugin'
}

android {
    namespace 'uz.fido.network'

    defaultConfig {
        minSdkVersion ConfigData.MIN_SDK_VERSION
        compileSdk ConfigData.COMPILE_SDK_VERSION
        targetSdkVersion ConfigData.TARGET_SDK_VERSION
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"

        externalNativeBuild {
            cmake {
                cppFlags("")
            }
        }
    }
    buildFeatures {
        buildConfig true
    }
    externalNativeBuild {
        cmake {
            path = "src/main/cpp/CMakeLists.txt"
            version = "3.22.1"
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {

    //hilt
    implementation ProjectDependencies.hiltAndroid
    kapt ProjectDependencies.hiltCompiler

    //retrofit
    implementation ProjectDependencies.retrofit
    implementation ProjectDependencies.retrofitConverter
    implementation ProjectDependencies.gson

    implementation ProjectDependencies.roomRuntime
    kapt ProjectDependencies.roomCompiler
    implementation ProjectDependencies.roomKtx

    //logging
    debugImplementation ProjectDependencies.chuckerLib
    releaseImplementation ProjectDependencies.chuckerLibNoOp

    implementation ProjectDependencies.paper
    implementation ProjectDependencies.okhttp
    implementation ProjectDependencies.okhttpLogging

    //utils module
    implementation project(path: ':utils')

}